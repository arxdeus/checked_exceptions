name: checked_exceptions
description: >-
  Checked exceptions for Dart, as an analyzer plugin. A call to a
  @Throws-annotated function must be caught or propagated, and a catch clause
  must not silently swallow it.
version: 1.0.0
homepage: https://github.com/arxdeus/checked_exceptions
repository: https://github.com/arxdeus/checked_exceptions
issue_tracker: https://github.com/arxdeus/checked_exceptions/issues

funding:
  - https://ko-fi.com/arxdeus

topics:
  - analyzer-plugin
  - lints
  - static-analysis
  - exceptions

environment:
  sdk: ^3.13.2

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17
  analyzer_plugin_toolkit: ^1.0.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  arxdeus_lints: ^1.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0

# Redirects this example's version dependencies to the working tree.
#
# The example's own pubspec names `checked_exceptions: ^1.0.0`, which is what a
# consumer writes and what the published archive must contain. In the
# repository that constraint has nothing to resolve against, so these overrides
# point at the sibling directories instead. The example therefore always
# demonstrates the code as it stands here, not the last published release.
#
# Kept out of the archive by this package's .pubignore.
dependency_overrides:
  checked_exceptions:
    path: ../
  analyzer_plugin_toolkit:
    path: ../../analyzer_plugin_toolkit
  arxdeus_lints:
    path: ../../arxdeus_lints

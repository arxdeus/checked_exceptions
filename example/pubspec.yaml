name: checked_exceptions_example
description: Demonstrates the checked_exceptions analyzer plugin.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.2

# Depended on by version, exactly as a consumer would write it, so the example
# in the published archive resolves against pub.dev like any other project.
#
# In the repository these point at nothing that exists yet, so
# `pubspec_overrides.yaml` beside this file redirects them to the working tree.
dependencies:
  checked_exceptions: ^1.0.0

dev_dependencies:
  # For the shared lint configuration this example's analysis_options.yaml
  # includes.
  arxdeus_lints: ^1.0.0

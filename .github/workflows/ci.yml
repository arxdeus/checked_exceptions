name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - run: dart test

  # The unit tests drive the rules through the analyzer's testing harness, which
  # never loads the plugin the way the analysis server does. Only the example
  # exercises that path, so only the example can catch a plugin that registers
  # under the wrong name, or fails to start at all, while every test still
  # passes. This package shipped exactly that fault until it was noticed by
  # hand, so it is checked here rather than assumed.
  #
  # The example's `analysis_options.yaml` reaches the plugin by path, and has to:
  # a version constraint there sends the analysis server to pub.dev, and a
  # `pubspec_overrides.yaml` does not redirect it, because the server resolves a
  # plugin independently of the surrounding package.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart pub get
        working-directory: example

      # Not `dart analyze` here: the example leaves exceptions unhandled and
      # swallows one on purpose, so it reports by design and can never exit
      # zero. What matters is that it reports exactly what its comments claim,
      # which is a stronger check than a clean run.
      - name: Verify the example reports what it documents
        run: dart run tool/verify_example.dart

  # The SDK table is a hand-written list of Dart and Flutter members known to
  # throw. An entry naming a member that does not exist, or one the rule's own
  # lookup cannot reach, fails silently: no test breaks, the lint simply never
  # fires for it. So every entry is resolved against the real SDKs, which needs
  # Flutter, and a package that really depends on it.
  sdk-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: dart pub get

      - run: flutter pub get
        working-directory: example_flutter

      - run: dart run tool/verify_sdk_table.dart

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart pub publish --dry-run

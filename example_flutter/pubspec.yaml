name: checked_exceptions_flutter_example
description: Demonstrates unhandled_throws against the real Flutter SDK.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  checked_exceptions:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# The plugin above depends on `analyzer_plugin_toolkit` by version, because
# that is what it publishes with. In the repository the toolkit is not on
# pub.dev yet, so point the example at the working tree.
dependency_overrides:
  analyzer_plugin_toolkit:
    path: ../../analyzer_plugin_toolkit

name: checked_exceptions_flutter_example
description: Demonstrates unhandled_throws against the real Flutter SDK.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  checked_exceptions:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  # For the shared lint configuration this example's analysis_options.yaml
  # includes.
  arxdeus_lints: ^1.0.0
  flutter_test:
    sdk: flutter

# The one place a path dependency survives.
#
# `flutter_test` pins `test_api`, which forces an old `package:test`, which
# caps `analyzer` below the ^14 an analyzer plugin needs. A Flutter package
# and an analyzer plugin therefore cannot share one version solution, so this
# example resolves on its own, with `flutter pub get` run from this directory.
#
# Until the packages it names are published, it reaches them by path. That is
# correct for what this is: a demonstration, never published, whose job is to
# show the rules firing against the real Flutter SDK.
dependency_overrides:
  analyzer_plugin_toolkit:
    path: ../../analyzer_plugin_toolkit
  arxdeus_lints:
    path: ../../arxdeus_lints

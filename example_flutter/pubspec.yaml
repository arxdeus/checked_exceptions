name: checked_exceptions_flutter_example
description: Demonstrates unhandled_throws against the real Flutter SDK.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  checked_exceptions:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  # For the shared lint configuration this example's analysis_options.yaml
  # includes. Not a workspace member, so it must name it itself.
  arxdeus_lints: ^2.0.0
  flutter_test:
    sdk: flutter

# Not a workspace member, and the one place a path dependency survives.
#
# `flutter_test` pins `test_api`, which forces an old `package:test`, which
# caps `analyzer` below the ^14 every plugin here needs. A workspace resolves
# to a single version solution, so a Flutter package and an analyzer plugin
# cannot both be members of it. This example therefore resolves on its own,
# with `flutter pub get` run from this directory.
#
# Being outside the workspace, it cannot see the sibling packages by version
# either, so it names them by path. That is correct for what this is: a
# demonstration, never published, whose job is to show the rules firing
# against the real Flutter SDK.
dependency_overrides:
  analyzer_plugin_toolkit:
    path: ../../analyzer_plugin_toolkit
  arxdeus_lints:
    path: ../../arxdeus_lints
